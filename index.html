<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Design Copycat AI — AI product photos from any reference design</title>
    <meta
      name="description"
      content="Upload a design you like and your own product photo. Design Copycat AI rebuilds that layout around your product — no studio, no designer, no subscription."
    />
    <link rel="icon" type="image/webp" href="/img/logo_copycat.webp" />

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-BLNK0ZWFMM"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag('js', new Date());

      gtag('config', 'G-BLNK0ZWFMM');
    </script>

    <!--
      Đặt theme TRƯỚC khi trang vẽ, nếu không sẽ chớp một nhịp sai màu khi người
      dùng đang để chế độ tối. Mặc định là chế độ sáng.
    -->
    <script>
      (function () {
        var theme = 'light';
        try {
          if (localStorage.getItem('copycat-theme') === 'dark') theme = 'dark';
        } catch (e) {
          /* trình duyệt chặn localStorage — dùng mặc định */
        }
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>

    <style>
      /*
        Toàn bộ bảng màu nằm ở đây dưới dạng biến CSS, ghi theo bộ ba kênh RGB để
        Tailwind vẫn dùng được cú pháp độ mờ (vd bg-dark-900/50).

        Nhờ vậy đổi theme chỉ là đổi giá trị biến — không phải sửa class ở từng
        thành phần giao diện.

        Quy ước tên:
          --s-*   bề mặt (surface): nền trang, thẻ, ô nhập, viền
          --t-*   chữ (text): 100 = rõ nhất → 700 = mờ nhất
          --st-*  màu trạng thái: đỏ / xanh lá / vàng / xanh dương / cam
      */

      :root,
      :root[data-theme='light'] {
        color-scheme: light;

        /* Nền ghi dịu, không trắng chói. Thẻ sáng hơn nền để nổi khối. */
        --s-950: 235 235 233;
        --s-900: 250 250 249;
        --s-850: 243 243 241;
        --s-800: 224 223 219;
        --s-700: 205 204 199;
        --s-600: 186 185 179;

        --t-100: 26 26 24;
        --t-200: 41 41 38;
        --t-300: 63 62 58;
        --t-400: 92 91 86;
        --t-500: 117 115 109;
        --t-600: 144 142 135;
        --t-700: 172 170 162;

        /*
          Nền tối dùng bậc màu nhạt cho chữ và bậc đậm cho nền tint; nền sáng phải
          lật ngược lại. Các cặp dưới đây đã được tính độ tương phản WCAG trên nền
          thẻ #FAFAF9 và đều đạt tối thiểu 4,5:1 (mức AA cho chữ nhỏ):

            Badge xanh 5,90  ·  Badge đỏ 5,55  ·  Badge vàng 6,28  ·  Badge cam 6,07
            Alert lỗi 5,80   ·  thành công 6,22  ·  cảnh báo 6,33  ·  thông tin 5,74

          Đổi bất kỳ giá trị nào ở đây thì phải tính lại tương phản.
        */
        --st-red-300: 178 26 26;
        --st-red-400: 178 26 26;
        --st-red-900: 252 165 165;
        --st-red-950: 254 202 202;
        --st-green-300: 20 100 48;
        --st-green-400: 21 105 50;
        --st-green-500: 22 163 74;
        --st-green-900: 134 239 172;
        --st-amber-300: 146 64 14;
        --st-amber-400: 146 64 14;
        --st-yellow-400: 146 64 14;
        --st-yellow-900: 253 224 71;
        --st-blue-300: 29 78 216;
        --st-blue-400: 37 99 235;
        --st-orange-400: 154 52 18;
        --st-orange-900: 253 186 116;
      }

      :root[data-theme='dark'] {
        color-scheme: dark;

        --s-950: 10 10 10;
        --s-900: 18 18 18;
        --s-850: 26 26 26;
        --s-800: 37 37 37;
        --s-700: 44 44 44;
        --s-600: 58 58 58;

        --t-100: 243 244 246;
        --t-200: 229 231 235;
        --t-300: 209 213 219;
        --t-400: 156 163 175;
        --t-500: 107 114 128;
        --t-600: 75 85 99;
        --t-700: 55 65 81;

        --st-red-300: 252 165 165;
        --st-red-400: 248 113 113;
        --st-red-900: 127 29 29;
        --st-red-950: 69 10 10;
        --st-green-300: 134 239 172;
        --st-green-400: 74 222 128;
        --st-green-500: 34 197 94;
        --st-green-900: 20 83 45;
        --st-amber-300: 252 211 77;
        --st-amber-400: 251 191 36;
        --st-yellow-400: 250 204 21;
        --st-yellow-900: 113 63 18;
        --st-blue-300: 147 197 253;
        --st-blue-400: 96 165 250;
        --st-orange-400: 251 146 60;
        --st-orange-900: 124 45 18;
      }

      body {
        font-family: 'Inter', sans-serif;
        background-color: rgb(var(--s-950));
        color: rgb(var(--t-300));
        transition: background-color 0.15s ease, color 0.15s ease;
      }

      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: rgb(var(--s-850));
      }
      ::-webkit-scrollbar-thumb {
        background: rgb(var(--s-700));
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #e60023;
      }

      /* =====================================================================
         HIỆU ỨNG TRANG GIỚI THIỆU (landing page)

         Tất cả tiền tố `lp-` và CHỈ dùng ở trang chủ "/" — các trang ứng dụng
         bên trong (/tao-anh, /lich-su...) cố tình giữ nguyên, không chuyển động,
         để không làm phiền người đang làm việc.

         Vì dự án không có bước build CSS (Tailwind chạy qua Play CDN), keyframes
         phải khai báo ở đây thay vì trong file .css riêng.
         ===================================================================== */

      @keyframes lp-fade-up {
        from {
          opacity: 0;
          transform: translateY(28px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }

      @keyframes lp-fade-in {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      @keyframes lp-zoom-in {
        from {
          opacity: 0;
          transform: scale(0.94);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }

      /* Vệt màu mờ trôi phía sau nội dung */
      @keyframes lp-blob {
        0%,
        100% {
          transform: translate(0, 0) scale(1);
        }
        33% {
          transform: translate(4%, -6%) scale(1.12);
        }
        66% {
          transform: translate(-5%, 4%) scale(0.94);
        }
      }

      /* Dải logo/chữ chạy ngang vô tận: nội dung được nhân đôi trong DOM nên
         dịch đúng 50% là quay về đúng khung hình đầu tiên, không thấy điểm nối. */
      @keyframes lp-marquee {
        from {
          transform: translateX(0);
        }
        to {
          transform: translateX(-50%);
        }
      }

      /* Vòng sóng lan ra từ chấm trạng thái */
      @keyframes lp-ping-ring {
        0% {
          transform: scale(0.6);
          opacity: 0.7;
        }
        100% {
          transform: scale(2.4);
          opacity: 0;
        }
      }

      /* Nét kẻ nối các bước trong quy trình, tự "vẽ" từ trên xuống */
      @keyframes lp-draw {
        from {
          transform: scaleY(0);
        }
        to {
          transform: scaleY(1);
        }
      }

      /*
        Phần tử chờ hiệu ứng cuộn: ẩn sẵn, <Reveal> gắn .is-visible khi lọt vào
        khung nhìn. Nếu JS chết thì `.lp-reveal` vẫn phải đọc được, nên fallback
        dưới cùng bật lại opacity khi người dùng tắt hiệu ứng chuyển động.
      */
      .lp-reveal {
        opacity: 0;
        will-change: opacity, transform;
      }
      .lp-reveal.is-visible {
        animation: lp-fade-up 0.75s cubic-bezier(0.16, 1, 0.3, 1) both;
      }
      .lp-reveal[data-anim='fade'].is-visible {
        animation-name: lp-fade-in;
      }
      .lp-reveal[data-anim='zoom'].is-visible {
        animation-name: lp-zoom-in;
      }

      .lp-blob {
        animation: lp-blob 18s ease-in-out infinite;
      }
      .lp-marquee {
        animation: lp-marquee 32s linear infinite;
      }
      .lp-ping-ring {
        animation: lp-ping-ring 2s ease-out infinite;
      }
      /*
        Nét kẻ nối các bước: đứng yên ở trạng thái chưa vẽ, chỉ chạy khi khối
        <Reveal> bọc ngoài lọt vào khung nhìn. Nếu để nó tự chạy lúc tải trang
        thì lúc người dùng cuộn tới nơi, nét đã vẽ xong từ đời nào.
      */
      .lp-line {
        transform: scaleY(0);
        transform-origin: top;
      }
      .lp-reveal.is-visible .lp-line {
        animation: lp-draw 1.1s cubic-bezier(0.16, 1, 0.3, 1) 150ms both;
      }

      /* Dừng marquee khi rê chuột để người dùng đọc kịp */
      .lp-marquee-track:hover .lp-marquee {
        animation-play-state: paused;
      }

      /*
        Cửa sổ phóng to ảnh ở phần Quy trình. Mở ra phải có một nhịp mờ dần rất
        ngắn: bật thẳng lớp phủ đen kín màn hình là chói mắt.
      */
      .lp-lightbox {
        animation: lp-fade-in 0.18s ease-out both;
      }
      .lp-lightbox > figure {
        animation: lp-zoom-in 0.24s cubic-bezier(0.16, 1, 0.3, 1) both;
      }

      /* Lưới mờ làm nền, dùng biến màu nên tự đổi theo sáng/tối */
      .lp-grid {
        background-image: linear-gradient(rgb(var(--s-700) / 0.5) 1px, transparent 1px),
          linear-gradient(90deg, rgb(var(--s-700) / 0.5) 1px, transparent 1px);
        background-size: 56px 56px;
        mask-image: radial-gradient(ellipse 80% 60% at 50% 0%, #000 30%, transparent 75%);
        -webkit-mask-image: radial-gradient(ellipse 80% 60% at 50% 0%, #000 30%, transparent 75%);
      }

      /* Chữ chuyển sắc theo màu thương hiệu */
      .lp-gradient-text {
        background-image: linear-gradient(100deg, #e60023 0%, #ff5a5f 45%, #ff9d4d 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      /* Viền chuyển sắc: lớp nền gradient, ruột đè lên bằng màu thẻ */
      .lp-gradient-border {
        position: relative;
        background: linear-gradient(140deg, rgb(230 0 35 / 0.55), rgb(255 157 77 / 0.35), rgb(var(--s-700) / 0.6));
      }

      /* Bấm vào mục lục / neo trong trang thì trượt tới thay vì nhảy cóc */
      @media (prefers-reduced-motion: no-preference) {
        html {
          scroll-behavior: smooth;
        }
      }

      /*
        Tôn trọng cài đặt "giảm chuyển động" của hệ điều hành: tắt sạch mọi hiệu
        ứng lặp và cho nội dung hiện thẳng ra.
      */
      @media (prefers-reduced-motion: reduce) {
        .lp-reveal,
        .lp-reveal.is-visible {
          opacity: 1 !important;
          animation: none !important;
        }
        .lp-blob,
        .lp-marquee,
        .lp-ping-ring,
        .lp-lightbox,
        .lp-lightbox > figure,
        .lp-reveal.is-visible .lp-line {
          animation: none !important;
        }
        .lp-line {
          transform: none !important;
        }
      }
    </style>

    <!--
      Tailwind chạy qua CDN (Play CDN) như bản gốc của dự án: không cần bước build CSS.
      Nếu sau này cần tối ưu tốc độ tải, cài tailwindcss vào dự án và bỏ thẻ script này.
    -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      // rgb(...) + <alpha-value> để các class kiểu bg-dark-900/50 vẫn hoạt động.
      var themed = function (name) {
        return 'rgb(var(' + name + ') / <alpha-value>)';
      };

      tailwind.config = {
        theme: {
          extend: {
            colors: {
              // Đỏ thương hiệu giữ nguyên ở cả hai chế độ: nó luôn nằm trên nền
              // đặc và luôn đi kèm chữ trắng.
              brand: {
                500: '#E60023',
                600: '#ad081b',
              },
              dark: {
                950: themed('--s-950'),
                900: themed('--s-900'),
                850: themed('--s-850'),
                800: themed('--s-800'),
                700: themed('--s-700'),
                600: themed('--s-600'),
              },
              gray: {
                100: themed('--t-100'),
                200: themed('--t-200'),
                300: themed('--t-300'),
                400: themed('--t-400'),
                500: themed('--t-500'),
                600: themed('--t-600'),
                700: themed('--t-700'),
              },
              red: {
                300: themed('--st-red-300'),
                400: themed('--st-red-400'),
                900: themed('--st-red-900'),
                950: themed('--st-red-950'),
              },
              green: {
                300: themed('--st-green-300'),
                400: themed('--st-green-400'),
                500: themed('--st-green-500'),
                900: themed('--st-green-900'),
              },
              amber: {
                300: themed('--st-amber-300'),
                400: themed('--st-amber-400'),
              },
              yellow: {
                400: themed('--st-yellow-400'),
                900: themed('--st-yellow-900'),
              },
              blue: {
                300: themed('--st-blue-300'),
                400: themed('--st-blue-400'),
              },
              orange: {
                400: themed('--st-orange-400'),
                900: themed('--st-orange-900'),
              },
            },
          },
        },
      };
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
